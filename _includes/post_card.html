<article>
    <header>
        <a href="{{ post.url | prepend: site.baseurl }}">
            <img src="{{ post.image | prepend: site.baseurl }}" alt="{{ post.title }}" {% if include.loading == "lazy" %} loading="lazy" {% endif %} />
        </a>
    </header>
    <h5><a href="{{ post.url | prepend: site.baseurl }}">{{post.title}}</a></h5>
    {% if post.category %}Category : <a href="{{ site.baseurl }}/categories/#{{ post.category | slugify }}" class="category">{{ post.category }}</a>{% endif %}
    <br/><small>Tags : {% for tag in post.tags %}<a href="{{ site.baseurl }}/tags/#{{ tag | slugify }}" class="tag">{{ tag }}</a>{% endfor %}</small>
    <p>
        {{ post.content | strip_html | newlines_to_br | truncatewords: 50 | normalize_whitespace | xml_escape }}
        <br/><a href="{{ post.url | prepend: site.baseurl }}">&rarr;&nbsp;Read</a>
    </p>
    <footer><small>{{ post.date | date: "%-d/%m/%Y" }}</small></footer>
</article>
